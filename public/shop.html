<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop | {{name}}</title>
<meta name="description" content="Order cannabis online for in-store pickup.">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="shop">
<div id="site-header"></div>
<main id="main">
<section><div class="wrap">
  <h1>Shop the menu</h1>
  <div class="store-bar" id="store-bar"></div>
  <div class="toolbar">
    <input id="search" type="search" placeholder="Search products" aria-label="Search products">
    <select id="sort" aria-label="Sort"><option value="">Featured</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option></select>
  </div>
  <div class="chips" id="chips" style="margin-bottom:24px"></div>
  <div class="grid products" id="grid"></div>
</div></section>
</main>
<div id="site-footer"></div>
<script src="/js/app.js"></script>
</body>
</html>
